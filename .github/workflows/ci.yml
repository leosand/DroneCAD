# DroneCAD — CI — Phase 4 : lint, image + colcon + Gazebo headless, scan Trivy
# EN: quality gate. Trivy policy: HIGH/CRITICAL *fixable* only (documented in REPORT.md).
# FR : porte qualité. Politique Trivy : HIGH/CRITICAL *corrigeables* uniquement (documenté dans REPORT.md).
# EN: actions pinned by SHA (harness DevSecOps rule) / FR : actions épinglées par SHA.
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose config / validation du compose
        run: docker compose config -q
      - name: Stack validation / validation de la pile
        run: python3 scripts/validate_stack.py
      - name: URDF structural checks / contrôles structurels URDF
        run: |
          python3 -m venv /tmp/urdfvenv
          /tmp/urdfvenv/bin/pip install --quiet xacro pytest
          /tmp/urdfvenv/bin/python -m pytest ws/src/humanoid_description/test/test_urdf.py -q
      - name: Agent guard tests / tests des garde-fous agentiques
        run: /tmp/urdfvenv/bin/python -m pytest agent/tests -q

  lint:
    # EN: ruff on the agentic layer + ROS 2 packages / FR : ruff sur la couche agentique + paquets ROS 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff — Python lint
        run: |
          python3 -m venv /tmp/lintvenv
          /tmp/lintvenv/bin/pip install --quiet ruff
          /tmp/lintvenv/bin/ruff check agent scripts ws/src

  container-tests:
    # EN: builds the shipped image (GHA layer cache), runs colcon + the headless standing test
    #     inside it, then Trivy-scans the image. Runner uid is mapped so bind mounts stay writable.
    # FR : construit l'image livrée (cache de couches GHA), exécute colcon + le test debout headless
    #     dedans, puis scanne l'image avec Trivy. L'uid du runner est mappé pour les montages.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (buildx + cache GHA)
        run: |
          docker buildx build --load \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t dronecad/ros2-jazzy:ci docker/ros2-jazzy
      - name: Colcon build + URDF tests (container)
        run: |
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -e HOME=/tmp -e ROS_LOG_DIR=/tmp/ros_logs \
            -v "$PWD/ws:/workspace" dronecad/ros2-jazzy:ci bash -lc "
              source /opt/ros/jazzy/setup.bash &&
              cd /workspace && colcon build &&
              source install/setup.bash &&
              python3 -m pytest /workspace/src/humanoid_description/test/test_urdf.py -q"
      - name: Gazebo server smoke (container)
        # EN: separates "does the simulator start at all?" from "does the robot stand?" — the
        #     2026-09-19 CI runs showed a silent `gz sim` (no topic list, no log line) while it
        #     worked on the workstation, so this step captures the server's real output.
        # FR : sépare « le simulateur démarre-t-il ? » de « le robot tient-il debout ? » — les
        #     runs CI du 2026-09-19 montraient un `gz sim` muet (aucune liste de topics, aucune
        #     ligne de journal) alors qu'il fonctionne sur la station, donc cette étape capture
        #     la sortie réelle du serveur.
        # EN: runs as uid 1000 (`ubuntu` in the image) for the same reason as the standing test
        #     below — an uid without a passwd entry makes gz-transport silent — and mounts the
        #     workspace read-only (the server only reads the world file).
        # FR : tourne en uid 1000 (`ubuntu` de l'image) pour la même raison que le test debout
        #     ci-dessous — un uid sans entrée passwd rend gz-transport muet — et monte l'espace de
        #     travail en lecture seule (le serveur ne fait que lire le fichier de monde).
        run: |
          docker run --rm --network host --user 1000:1000 --shm-size=1g -e HOME=/tmp -e ROS_LOG_DIR=/tmp/ros_logs \
            -v "$PWD/ws:/workspace:ro" dronecad/ros2-jazzy:ci bash -lc '
              source /opt/ros/jazzy/setup.bash ;
              W=/workspace/install/humanoid_gazebo/share/humanoid_gazebo/worlds/flat_ground_headless.sdf ;
              ( timeout 90 gz sim -r -s $W > /tmp/gz.log 2>&1 & ) ;
              sleep 25 ;
              echo "--- topics annoncés ---" ; gz topic -l | head -5 ;
              if gz topic -l | grep -q "^/clock" ; then
                echo "SMOKE OK — le serveur annonce ses topics" ; rc=0 ;
              else
                echo "ECHEC — aucun topic annoncé par le serveur" ; tail -20 /tmp/gz.log ; rc=1 ;
              fi ;
              pkill -f "gz sim" ; exit $rc'
      - name: Headless Gazebo standing test (container)
        # EN: uid 1000 (the image's `ubuntu`, present in /etc/passwd) — the runner's uid 1001 has
        #     no passwd entry and gz-transport then discovers nothing (reproduced on the
        #     workstation: uid 1000 → topics listed, uid 1001 → silent, 2026-09-19). The workspace
        #     is mounted read-only because this step only reads the built install tree.
        # FR : uid 1000 (`ubuntu` de l'image, présent dans /etc/passwd) — l'uid 1001 du runner n'a
        #     aucune entrée passwd et gz-transport ne découvre alors rien (reproduit sur la station :
        #     uid 1000 → topics listés, uid 1001 → muet, 2026-09-19). L'espace de travail est monté
        #     en lecture seule, cette étape ne fait que lire l'arborescence install compilée.
        run: |
          docker run --rm --network host --user 1000:1000 --shm-size=1g -e HOME=/tmp -e ROS_LOG_DIR=/tmp/ros_logs \
            -v "$PWD/ws:/workspace:ro" dronecad/ros2-jazzy:ci bash -lc "
              source /opt/ros/jazzy/setup.bash &&
              source /workspace/install/setup.bash &&
              cd /workspace && python3 -m pytest src/humanoid_gazebo/test/test_stand.py -q -s -o cache_dir=/tmp/.pytest_cache"
      - name: Free disk space before Trivy / libérer l'espace avant Trivy
        # EN: the shipped image is 6.3 GB; Trivy exports it to /tmp to analyse the layers and
        #     the runner ran out of space (`no space left on device`, run 35416596774). The
        #     buildkit cache is only local — the GHA cache still holds the layers.
        # FR : l'image livrée fait 6,3 Go ; Trivy l'exporte dans /tmp pour analyser les couches et
        #     le runner a manqué d'espace (« no space left on device », run 35416596774). Le cache
        #     buildkit est local seulement — le cache GHA conserve les couches.
        run: |
          echo "--- avant / before ---" ; df -h / /tmp /mnt 2>/dev/null | tail -3
          # EN: the runner ships ~20 GB of toolchains this job never uses (the 6.3 GB image is
          #     exported uncompressed by Trivy: ~20 GB needed, only 8.6 GB free).
          # FR : le runner embarque ~20 Go de chaînes d'outils inutilisées ici (l'image de 6,3 Go
          #     est exportée décompressée par Trivy : ~20 Go requis pour 8,6 Go libres).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          docker builder prune -af || true
          docker image prune -f || true
          echo "--- apres / after ---" ; df -h / /tmp /mnt 2>/dev/null | tail -3
      - name: Trivy scan (HIGH/CRITICAL fixables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dronecad/ros2-jazzy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    # EN: compensating control — GitHub secret scanning / push protection are unavailable
    #     on private repos without GitHub Advanced Security (API 422, verified 2026-09-18).
    # FR : contrôle compensatoire — le scan de secrets GitHub et la protection contre l'envoi
    #     sont indisponibles sur un repo privé sans GHAS (API 422, vérifié le 2026-09-18).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # EN: list PR commits only / FR : lister les commits de la PR uniquement
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # EN: no PR write needed / FR : aucune écriture PR requise
