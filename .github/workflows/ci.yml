# DroneCAD — CI (scaffold) — Phase 4 étoffera : colcon, Gazebo headless, Trivy
# EN: validates compose + MCP registry + security baseline. Actions pinned by SHA (DevSecOps rule).
# FR : valide le compose + le registre MCP + le socle sécurité. Actions épinglées par SHA.
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose config / validation du compose
        run: docker compose config -q
      - name: Stack validation / validation de la pile
        run: python3 scripts/validate_stack.py

  secret-scan:
    # EN: compensating control — GitHub secret scanning / push protection are unavailable
    #     on private repos without GitHub Advanced Security (API 422, verified 2026-09-18).
    # FR : contrôle compensatoire — le scan de secrets GitHub et la protection contre l'envoi
    #     sont indisponibles sur un repo privé sans GHAS (API 422, vérifié 2026-09-18).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
