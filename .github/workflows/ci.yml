# DroneCAD — CI — Phase 4 : lint, image + colcon + Gazebo headless, scan Trivy
# EN: quality gate. Trivy policy: HIGH/CRITICAL *fixable* only (documented in REPORT.md).
# FR : porte qualité. Politique Trivy : HIGH/CRITICAL *corrigeables* uniquement (documenté dans REPORT.md).
# EN: actions pinned by SHA (harness DevSecOps rule) / FR : actions épinglées par SHA.
name: ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose config / validation du compose
        run: docker compose config -q
      - name: Stack validation / validation de la pile
        run: python3 scripts/validate_stack.py
      - name: URDF structural checks / contrôles structurels URDF
        run: |
          python3 -m venv /tmp/urdfvenv
          /tmp/urdfvenv/bin/pip install --quiet xacro pytest
          /tmp/urdfvenv/bin/python -m pytest ws/src/humanoid_description/test/test_urdf.py -q
      - name: Agent guard tests / tests des garde-fous agentiques
        run: /tmp/urdfvenv/bin/python -m pytest agent/tests -q

  lint:
    # EN: ruff on the agentic layer + ROS 2 packages / FR : ruff sur la couche agentique + paquets ROS 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff — Python lint
        run: |
          python3 -m venv /tmp/lintvenv
          /tmp/lintvenv/bin/pip install --quiet ruff
          /tmp/lintvenv/bin/ruff check agent scripts ws/src

  container-tests:
    # EN: builds the shipped image (GHA layer cache), runs colcon + the headless standing test
    #     inside it, then Trivy-scans the image. Runner uid is mapped so bind mounts stay writable.
    # FR : construit l'image livrée (cache de couches GHA), exécute colcon + le test debout headless
    #     dedans, puis scanne l'image avec Trivy. L'uid du runner est mappé pour les montages.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (buildx + cache GHA)
        run: |
          docker buildx build --load \
            --cache-from type=gha --cache-to type=gha,mode=max \
            -t dronecad/ros2-jazzy:ci docker/ros2-jazzy
      - name: Colcon build + URDF tests (container)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e ROS_LOG_DIR=/tmp/ros_logs \
            -v "$PWD/ws:/workspace" dronecad/ros2-jazzy:ci bash -lc "
              source /opt/ros/jazzy/setup.bash &&
              cd /workspace && colcon build &&
              source install/setup.bash &&
              python3 -m pytest /workspace/src/humanoid_description/test/test_urdf.py -q"
      - name: Headless Gazebo standing test (container)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e ROS_LOG_DIR=/tmp/ros_logs \
            -v "$PWD/ws:/workspace" dronecad/ros2-jazzy:ci bash -lc "
              source /opt/ros/jazzy/setup.bash &&
              source /workspace/install/setup.bash &&
              cd /workspace && python3 -m pytest src/humanoid_gazebo/test/test_stand.py -q -s"
      - name: Trivy scan (HIGH/CRITICAL fixables)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dronecad/ros2-jazzy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    # EN: compensating control — GitHub secret scanning / push protection are unavailable
    #     on private repos without GitHub Advanced Security (API 422, verified 2026-09-18).
    # FR : contrôle compensatoire — le scan de secrets GitHub et la protection contre l'envoi
    #     sont indisponibles sur un repo privé sans GHAS (API 422, vérifié le 2026-09-18).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # EN: list PR commits only / FR : lister les commits de la PR uniquement
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # EN: no PR write needed / FR : aucune écriture PR requise
